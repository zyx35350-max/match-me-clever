name: V1.2.2 Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes tsx src/lib/job-dedup-lifecycle.acceptance.ts
      - run: npx --yes tsx src/lib/job-discovery-pipeline.acceptance.ts
      - run: npx --yes tsx src/lib/job-adapter.acceptance.ts
      - run: npx --yes tsx src/lib/job-discovery-adapter.acceptance.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run format
      - run: npm run lint
